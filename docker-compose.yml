services:
  hr-sot:
    build: .
    # Image tag is overridable so multiple stacks on one host each build/tag a
    # DISTINCT image (e.g. HRSOT_IMAGE=demo-hr-sot:acme). Leaving it unset keeps
    # the shared default, which is fine for a single stack. Give each stack its
    # own tag when you want to update or remove just one instance's image.
    image: ${HRSOT_IMAGE:-demo-hr-sot:local}
    # Container name is overridable so a dev and a prod stack can coexist on the
    # same Docker host without a name collision (container names are global).
    container_name: ${HRSOT_CONTAINER_NAME:-demo-hr-sot}
    ports:
      - "${HRSOT_HOST_PORT:-8000}:8000"
    volumes:
      # Named volume (not a host bind mount): a fresh named volume inherits the
      # image's /data ownership (uid/gid 1000, the non-root `hrsot` user), so the
      # container can write session_secret/hrsot.db. A bind mount would be created
      # root-owned on the host and break with PermissionError.
      - hrsot-data:/data
    environment:
      # App config, overridable from a Portainer stack env / an .env file. Each
      # is passed through with the app's OWN default, so leaving a variable unset
      # keeps that default rather than clobbering it with an empty string. See
      # docs/DEPLOYMENT.md for the full reference and a ready-to-paste env file.
      #
      # Deliberately NOT passed through (fixed by this compose file's topology):
      #   HRSOT_DATA_DIR   — the volume is mounted at /data
      #   HRSOT_BIND_HOST  — the container binds 0.0.0.0
      #   HRSOT_BIND_PORT  — 8000 internally (port mapping + healthcheck assume it)
      #   HRSOT_APP_NAME / HRSOT_APP_VERSION — baked into the image
      HRSOT_LOG_LEVEL: ${HRSOT_LOG_LEVEL:-INFO}
      HRSOT_SESSION_SECRET: ${HRSOT_SESSION_SECRET:-}
      HRSOT_SESSION_MAX_AGE_SECONDS: ${HRSOT_SESSION_MAX_AGE_SECONDS:-28800}
      HRSOT_INITIAL_ADMIN_USERNAME: ${HRSOT_INITIAL_ADMIN_USERNAME:-robbytheadmin}
      # $$ escapes a literal $ so compose does not treat $@ as interpolation.
      HRSOT_INITIAL_ADMIN_PASSWORD: ${HRSOT_INITIAL_ADMIN_PASSWORD:-N0nPr0dF0r$$@viynt8}
      HRSOT_OAUTH_DEFAULT_TOKEN_LIFETIME_SECONDS: ${HRSOT_OAUTH_DEFAULT_TOKEN_LIFETIME_SECONDS:-3600}
      HRSOT_JWT_ALGORITHM: ${HRSOT_JWT_ALGORITHM:-HS256}
      HRSOT_PUBLIC_BASE_URL: ${HRSOT_PUBLIC_BASE_URL:-}
      HRSOT_AUDIT_RETENTION_DAYS: ${HRSOT_AUDIT_RETENTION_DAYS:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Streamable-HTTP MCP server. A separate, stateless container that proxies MCP
  # tool calls to hr-sot's REST API, forwarding each caller's own API token. It
  # holds no data and no credentials of its own.
  hr-mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    # Overridable per stack, same as HRSOT_IMAGE above (e.g. demo-hr-mcp:acme).
    image: ${HRMCP_IMAGE:-demo-hr-mcp:local}
    container_name: ${HRMCP_CONTAINER_NAME:-demo-hr-mcp}
    depends_on:
      hr-sot:
        # Wait until the app is healthy so early tool calls don't hit a cold API.
        condition: service_healthy
    # The container always listens on 8100 internally; HRMCP_HOST_PORT sets the
    # inbound (published) port. Set distinct HRMCP_HOST_PORT values to run dev
    # and prod MCP servers on one host, e.g. HRMCP_HOST_PORT=9026 -> 9026:8100.
    ports:
      - "${HRMCP_HOST_PORT:-8100}:8100"
    volumes:
      # Read-only: the MCP server reads its token files from the app's data volume
      # (mcp_api_key for outbound, mcp_gateway_tokens.json for inbound gateway
      # auth), both written by the app. Same uid (1000) so the 0600 files are
      # readable. It never writes here.
      - hrsot-data:/data:ro
    environment:
      # Reaches the app by its compose service name on the project network, so
      # the default stays correct even if HRSOT_CONTAINER_NAME is overridden.
      # All overridable from a stack env / .env file, each with its own default.
      # HRMCP_DATA_DIR is fixed (/data — where the volume is mounted); HRMCP_BIND_HOST
      # and HRMCP_BIND_PORT are fixed too (the container always listens on 8100).
      HRMCP_HR_API_BASE_URL: ${HRMCP_HR_API_BASE_URL:-http://hr-sot:8000}
      HRMCP_DATA_DIR: /data
      HRMCP_PATH: ${HRMCP_PATH:-/mcp}
      HRMCP_REQUEST_TIMEOUT_SECONDS: ${HRMCP_REQUEST_TIMEOUT_SECONDS:-30}
      HRMCP_LOG_LEVEL: ${HRMCP_LOG_LEVEL:-INFO}
      HRMCP_SERVER_NAME: ${HRMCP_SERVER_NAME:-hrsot-mcp}
      # Remote-host credential overrides — leave empty to use the UI-managed
      # token files on the shared /data volume (the normal Compose setup).
      HRMCP_API_KEY: ${HRMCP_API_KEY:-}
      HRMCP_API_KEY_FILE: ${HRMCP_API_KEY_FILE:-}
      HRMCP_AUTH_TOKEN: ${HRMCP_AUTH_TOKEN:-}
    restart: unless-stopped

volumes:
  hrsot-data:
